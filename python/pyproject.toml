[project]
name = "testscan"
dynamic = ["version"]
description = "Static analysis for AI-generated Python tests — thin launcher for the Go testscan CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Nikita527" },
]
keywords = [
  "testing",
  "linter",
  "pytest",
  "static-analysis",
  "ai",
  "test-smells",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Nikita527/testscan"
Repository = "https://github.com/Nikita527/testscan"
Issues = "https://github.com/Nikita527/testscan/issues"

[project.scripts]
testscan = "testscan_py.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>[0-9].*)"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = ".."
version_scheme = "no-guess-dev"

[tool.hatch.build.hooks.vcs]
version-file = "src/testscan_py/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/testscan_py"]
# иначе hatchling уважает .gitignore и выкидывает бинарник / *.exe из wheel
ignore-vcs = true
# exclude then force-include — иначе duplicate path в wheel
exclude = [
  "src/testscan_py/bin",
]

[tool.hatch.build.targets.wheel.force-include]
"src/testscan_py/bin" = "testscan_py/bin"

[tool.hatch.build.targets.sdist]
exclude = [
  "src/testscan_py/bin/testscan",
  "src/testscan_py/bin/testscan.exe",
]
